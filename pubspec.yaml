name: little_adventure_guild
description: A quiet daily adventure guild.
publish_to: none
version: 0.1.0+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Galmuri
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
  assets:
    - assets/privacy_policy.txt
    - assets/guild_interior_v4.png
    - assets/guild_floor_extension.png
    - assets/dialogue_frame.png
    - assets/wood_button.png
    - assets/sealed_scroll_v2.png
    - assets/quest_paper_normal.png
    - assets/quest_paper_hard.png
    - assets/decorations/
    - assets/keeper_idle/
    - assets/support/small-pixel.png
    - assets/support/generous-pixel.png
    - assets/support/special-pixel.png
    - assets/fonts/Galmuri-LICENSE.txt
    - assets/licenses/MS-Basic-LICENSE.txt










